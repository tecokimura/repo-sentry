name: Security Scan

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "スキャン対象リポジトリ (owner/repo 形式)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan-and-report:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # (1) repo-sentry のコードをチェックアウト
      # -------------------------------------------------------
      - name: repo-sentry をチェックアウト
        uses: actions/checkout@v7

      # -------------------------------------------------------
      # (2) 必須 Secret の早期チェック
      # -------------------------------------------------------
      - name: 必須 Secret の確認
        run: |
          if [[ -z "${{ secrets.OPENAI_API_KEY }}" ]]; then
            echo "::error::OPENAI_API_KEY が設定されていません。GitHub Secrets に OPENAI_API_KEY を設定してください。"
            exit 1
          fi

      # -------------------------------------------------------
      # (3) Docker image のビルド（GHA キャッシュ使用）
      # -------------------------------------------------------
      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v4

      - name: scan image をビルド
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: repo-sentry:local
          build-args: |
            DENO_VERSION=2.5.6
            GITLEAKS_VERSION=8.30.1
            TRIVY_VERSION=0.70.0
          cache-from: type=gha,scope=scan
          cache-to: type=gha,mode=max,scope=scan

      - name: enrich image をビルド
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.enrich
          load: true
          tags: repo-sentry-enrich:local
          build-args: DENO_VERSION=2.5.6
          cache-from: type=gha,scope=enrich
          cache-to: type=gha,mode=max,scope=enrich

      - name: report image をビルド
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.report
          load: true
          tags: repo-sentry-report:local
          build-args: DENO_VERSION=2.5.6
          cache-from: type=gha,scope=report
          cache-to: type=gha,mode=max,scope=report

      - name: export image をビルド
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.export
          load: true
          tags: repo-sentry-export:local
          cache-from: type=gha,scope=export
          cache-to: type=gha,mode=max,scope=export

      # -------------------------------------------------------
      # (4) スキャン対象リポジトリを clone
      #     公開リポジトリ : SCAN_TARGET_TOKEN 不要（token なしで clone）
      #     プライベートリポジトリ: GitHub Secrets に SCAN_TARGET_TOKEN を設定
      # -------------------------------------------------------
      - name: スキャン対象リポジトリを clone
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          SCAN_TARGET_TOKEN: ${{ secrets.SCAN_TARGET_TOKEN }}
        run: |
          # 形式チェック: owner/repo のみ許可（コマンドインジェクション対策）
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::target_repo の形式が不正です: ${TARGET_REPO}  ('owner/repo' 形式で入力してください)"
            exit 1
          fi

          if [[ -n "$SCAN_TARGET_TOKEN" ]]; then
            git clone --depth=1 \
              "https://x-access-token:${SCAN_TARGET_TOKEN}@github.com/${TARGET_REPO}" \
              ./scan-target
          else
            git clone --depth=1 \
              "https://github.com/${TARGET_REPO}" \
              ./scan-target
          fi

      # -------------------------------------------------------
      # (5) scan → enrich → report（docker-run.sh で一括実行）
      #     stdout に report.md の相対パスが出力される
      # -------------------------------------------------------
      - name: scan → enrich → report を実行
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_LLM_PROVIDER: openai
          REPORTS_DIR: ${{ github.workspace }}/reports
        run: |
          REPORT_MD=$(bash scripts/docker-run.sh ./scan-target)
          echo "report_md=$REPORT_MD" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # (6) PDF を生成（sentry-export）
      #     stdout に PDF の相対パスが出力される
      # -------------------------------------------------------
      - name: PDF を生成
        id: export
        run: |
          PDF_PATH=$(bash scripts/docker-export.sh "${{ steps.run.outputs.report_md }}")
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # (7) 成果物を Artifacts に保存
      #     if: always() → scan/report 失敗時も中途成果物を保存
      #     logs/ は reports/ の1つ上に出力されるため別途追加
      # -------------------------------------------------------
      - name: 成果物をアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report-${{ github.run_id }}
          path: |
            reports/
            logs/
          retention-days: 30
