services:
  repo-sentry:
    build:
      context: .
      args:
        DENO_VERSION: "2.5.6"
        GITLEAKS_VERSION: "8.30.1"
        TRIVY_VERSION: "0.70.0"
    image: repo-sentry:local
    environment:
      DENO_DIR: /workspace/.repo-sentry/deno-cache
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    volumes:
      - ./:/workspace/target:ro
      - ./reports:/workspace/reports
      - ./.repo-sentry:/workspace/.repo-sentry
    command:
      - run
      - --path
      - /workspace/target
      - --tools
      - gitleaks,trivy
      - --format
      - markdown
      - --output
      - /workspace/reports/latest.md
